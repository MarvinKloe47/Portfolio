<header class="header">
  <!-- Logo/Name -->
  <div class="logo">
    <img class="Logo" src="/assets/img/Logo.png" alt="Logo" />
  </div>

  <!-- Navigation (Desktop bleibt wie es ist) -->
  <nav class="nav">
    <a href="#about">Why me</a>
    <a href="#skills">Skills</a>
    <a href="#projects">Projects</a>
    <a href="#contact">Contact</a>
  </nav>

  <!-- Right Section -->
  <div class="header-right">
    <!-- Language (Desktop) -->
    <div class="lang">
      <button type="button">DE</button>
      <span>|</span>
      <button type="button">EN</button>
    </div>

    <!-- Burger (nur Mobile sichtbar per CSS) -->
    <button
      class="burger"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen"
      aria-label="Toggle menu"
    >
      <!-- Burger Icon -->
      <span class="burgerLines" *ngIf="!menuOpen">
        <i></i><i></i><i></i>
      </span>

      <!-- Close Icon -->
      <span class="closeIcon" *ngIf="menuOpen">×</span>
    </button>
  </div>
</header>

<!-- Fullscreen Mobile Menü (nur wenn offen) -->
<div class="mobileOverlay" *ngIf="menuOpen" (click)="closeMenu()">
  <div class="mobilePanel" (click)="$event.stopPropagation()">
    <nav class="mobileNav">
      <a href="#about" (click)="closeMenu()">Why me</a>
      <a href="#skills" (click)="closeMenu()">Skills</a>
      <a href="#projects" (click)="closeMenu()">Projects</a>
      <a href="#contact" (click)="closeMenu()">Contact</a>
    </nav>

    <div class="mobileLang">
      <button type="button">DE</button>
      <span>|</span>
      <button type="button">EN</button>
    </div>
  </div>
</div>
