<section class="skills" id="skills">
  <h2 class="skills-title">My Skills</h2>

 
  <div class="skills-rows desktop-only">
    <div class="skills-row">
      <div class="skill" *ngFor="let skill of skillsTop" [attr.data-skill]="skill.name">
        <div class="skill-icon">
          <img [src]="skill.icon" [alt]="skill.name" />
        </div>
        <span class="skill-name">{{ skill.name }}</span>
      </div>
    </div>

    <div class="skills-row">
      <div class="skill" *ngFor="let skill of skillsBottom" [attr.data-skill]="skill.name">
        <div class="skill-icon">
          <img [src]="skill.icon" [alt]="skill.name" />
        </div>
        <span class="skill-name">{{ skill.name }}</span>
      </div>
    </div>
  </div>

  
  <div class="mobile-only">
    <div class="skills-grid">
      <div class="skill" *ngFor="let skill of allSkills">
        <div class="skill-icon">
          <img [src]="skill.icon" [alt]="skill.name" />
        </div>
        <span class="skill-name">{{ skill.name }}</span>
      </div>

   
      <div class="skill challenge">
       
       
      </div>
    </div>

    <div class="skills-mobile-text">
      I am always happy to learn new technologies, just tell me what you need.
    </div>

    <a class="skills-cta" href="#contact">Let&#96;s talk</a>
  </div>
</section>
